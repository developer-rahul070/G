<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-bg"></div>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>


        <div class="login-box">

            <div class="login-logo">
                <i class="fa-solid fa-gamepad"></i>
                <span>NEXUS</span>
            </div>

            <p class="login-subtitle">
                ENTER THE GAMEVERSE
            </p>


            <form id="loginForm">

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        required
                    >

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="button" id="showPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    LOGIN
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button class="guest-login" id="guestLogin">
                <i class="fa-solid fa-user-secret"></i>
                Continue as Guest
            </button>


            <p class="register-text">
                New to NEXUS?
                <a href="#" id="registerBtn">Create Account</a>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
